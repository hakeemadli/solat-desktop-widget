<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'" />
  <title>Solat Widget</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="card" id="card">

    <header class="bar">
      <div class="brand">
        <span class="moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
          </svg>
        </span>
        <span class="brand-name">SOLAT</span>
        <button class="chip" id="zoneChip" title="Tukar zon">—</button>
      </div>
      <div class="actions">
        <button class="icon-btn" id="btnPin" title="Sentiasa di atas" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <path d="M9 3h6l-.8 6.2L18 13H6l3.8-3.8L9 3z" /><path d="M12 13v7" stroke-linecap="round" />
          </svg>
        </button>
        <button class="icon-btn" id="btnSettings" title="Tetapan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
            <circle cx="15" cy="7" r="2.2" /><circle cx="9" cy="17" r="2.2" />
          </svg>
        </button>
        <button class="icon-btn" id="btnMin" title="Sembunyi ke tray">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M6 12h12" />
          </svg>
        </button>
        <button class="icon-btn danger" id="btnClose" title="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M7 7l10 10M17 7L7 17" />
          </svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-top">
        <span class="eyebrow" id="nextEyebrow">Seterusnya</span>
        <span class="badge hidden" id="tomorrowBadge">Esok</span>
        <span class="badge hidden" id="staleBadge" title="Data cache digunakan">Cache</span>
      </div>
      <div class="hero-row">
        <span class="prayer-name" id="nextName">Memuatkan</span>
        <span class="prayer-at" id="nextAt">--:--</span>
      </div>
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="hero-foot" id="heroFoot">Mengambil data JAKIM…</div>
    </section>

    <section class="meta">
      <div class="meta-line" id="dateLine">—</div>
      <div class="meta-line subtle">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z" /><circle cx="12" cy="10" r="2.4" />
        </svg>
        <span id="locText">Mengesan lokasi…</span>
      </div>
    </section>

    <ul class="times" id="times"></ul>

    <footer class="foot">
      <span class="status" id="status">—</span>
      <button class="text-btn" id="btnRefresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M20 12a8 8 0 1 1-2.4-5.7" /><path d="M20 4v4.5h-4.5" />
        </svg>
        Muat semula
      </button>
    </footer>

    <!-- Panel tetapan -->
    <div class="sheet hidden" id="sheet">
      <div class="sheet-head">
        <span>Tetapan</span>
        <button class="icon-btn" id="btnCloseSheet" title="Tutup tetapan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M7 7l10 10M17 7L7 17" />
          </svg>
        </button>
      </div>

      <div class="sheet-body">
        <section class="group">
          <h3>Zon JAKIM</h3>
          <p class="hint" id="detectHint">Zon dipilih secara automatik daripada lokasi rangkaian.</p>
          <button class="btn" id="btnDetect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z" /><circle cx="12" cy="10" r="2.4" />
            </svg>
            Kesan lokasi saya
          </button>
          <input id="zoneSearch" type="search" placeholder="Cari zon, negeri atau daerah…" autocomplete="off" />
          <ul class="zone-list" id="zoneList"></ul>
        </section>

        <section class="group">
          <h3>Notifikasi</h3>
          <label class="toggle">
            <input type="checkbox" id="prefNotify" />
            <span>Notifikasi sebelum azan</span>
          </label>
          <label class="field">
            <span>Masa awal</span>
            <select id="prefLead">
              <option value="0">Tepat waktu</option>
              <option value="5">5 minit</option>
              <option value="10">10 minit</option>
              <option value="15">15 minit</option>
              <option value="20">20 minit</option>
              <option value="30">30 minit</option>
            </select>
          </label>
        </section>

        <section class="group">
          <h3>Paparan</h3>
          <label class="toggle">
            <input type="checkbox" id="prefTop" />
            <span>Sentiasa di atas</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="prefImsak" />
            <span>Tunjuk Imsak</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="prefSyuruk" />
            <span>Tunjuk Syuruk</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="prefHour12" />
            <span>Format 12 jam (PG/PTG)</span>
          </label>
        </section>

        <section class="group">
          <h3>Sistem</h3>
          <label class="toggle">
            <input type="checkbox" id="prefAuto" />
            <span>Mula bersama Windows</span>
          </label>
          <p class="hint" id="autoHint"></p>
        </section>

        <div class="sheet-foot">
          <span class="hint" id="versionText"></span>
          <div class="sheet-foot-actions">
            <button class="btn ghost" id="btnHide">Ke tray</button>
            <button class="btn danger-solid" id="btnQuit">Keluar</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="../shared/solat-core.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
